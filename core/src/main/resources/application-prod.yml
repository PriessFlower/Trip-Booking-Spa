management:
  endpoints:
    web:
      exposure:
        include: prometheus

#apollo相关配置 开始#
app:
  # 与Apollo Portal上面创建的app id保持一致
  id: hotel-spa
# 项目启动时需要添加启动参数 -Denv=DEV 来指定 apollo环境
apollo:
  # 就是apollo config server的地址
  meta: http://10.18.1.51:8080
  bootstrap:
    # 是否开启 Apollo
    enabled: true
    eagerLoad:
      # 将 Apollo 加载提到初始化日志系统之前，如果设置为false，则配置中心中修改日志信息不会生效
      enabled: true
    namespaces: application
  cacheDir: ./config
  # 刷新时间,单位：分钟，默认5
  refreshInterval: 5
#对应apollo配置中心环境
env: prod
#apollo相关配置 结束#

rocketmq:
  name-server: ep-2zeic261a507056922d5.epsrv-2ze9nhgmudbj2saxncjc.cn-beijing.privatelink.aliyuncs.com:8080
  producer:
    # 发送同一类消息的设置为同一个group，保证唯一
    group: springboot_producer_group
    access-key: VCfD8A4hmNR1a76u
    secret-key: Ywuy4wocfP8f0O73
    # 发送消息超时时间，默认3000
    sendMessageTimeout: 10000
    # 发送消息失败重试次数，默认2
    retryTimesWhenSendFailed: 2
    # 异步消息重试此处，默认2
    retryTimesWhenSendAsyncFailed: 2
    # 消息最大长度，默认1024 * 1024 * 4(默认4M)
    maxMessageSize: 4096
    # 压缩消息阈值，默认4k(1024 * 4)
    compressMessageBodyThreshold: 4096
    # 是否在内部发送失败时重试另一个broker，默认false
    retryNextServer: false


    topic: test
    #sync tag(同步消息tag)
    sync-tag: sync-tags
    #async tag(异步消息tag)
    async-tag: async-tags
    #oneway tag(单向消息tag)
    oneway-tag: oneway-tags

  consumer:
    group: GID_SPA_HOTEL
    #监听主题
    topic: HOTEL_BASE
    # 一次拉取消息最大值，注意是拉取消息的最大值而非消费最大值
    pull-batch-size: 20
    access-key: VCfD8A4hmNR1a76u
    secret-key: Ywuy4wocfP8f0O73
  hotel:
    group: GID_SPA_HOTEL
    topic: HOTEL_BASE
  room:
    group: GID_SPA_HOTEL
    topic: ROOM_BASE
  product:
    group: GID_SPA_HOTEL
    topic: PRODUCT_INFO

  enhance:
    # 启动隔离，用于激活配置类EnvironmentIsolationConfig
    # 启动后会自动在topic上拼接激活的配置文件，达到自动隔离的效果
    enabledIsolation: true
    # 隔离环境名称，拼接到topic后，topic_dev，默认空字符串
    environment: PROD

