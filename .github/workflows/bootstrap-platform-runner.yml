name: Bootstrap trip-prod-platform self-hosted runner

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/bootstrap-platform-runner.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-trip-prod-platform
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install GitHub Actions runner on trip-prod-platform
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Inspect platform server
        run: |
          ssh production 'set -Eeuo pipefail
            printf "architecture=%s\n" "$(uname -m)"
            printf "kernel=%s\n" "$(uname -sr)"
            printf "cpu_count=%s\n" "$(getconf _NPROCESSORS_ONLN)"
            awk "/MemTotal/ { printf \"memory_mib=%.0f\\n\", \$2 / 1024 }" /proc/meminfo
            df -Pm / | awk "NR == 2 { printf \"root_free_mib=%s\\n\", \$4 }"
            docker version --format "docker_server={{.Server.Version}}"
            if [ "$(id -u)" -eq 0 ] || sudo -n true 2>/dev/null; then
              echo "passwordless_admin=yes"
            else
              echo "passwordless_admin=no" >&2
              exit 1
            fi'

      - name: Download runner package on GitHub-hosted runner
        id: runner-package
        run: |
          set -Eeuo pipefail

          remote_arch="$(ssh production uname -m)"
          case "$remote_arch" in
            x86_64)
              runner_arch="x64"
              runner_sha="04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d"
              ;;
            aarch64|arm64)
              runner_arch="arm64"
              runner_sha="58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1"
              ;;
            *)
              echo "Unsupported runner architecture: $remote_arch" >&2
              exit 1
              ;;
          esac

          runner_version="2.336.0"
          archive="actions-runner-linux-${runner_arch}-${runner_version}.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          download_url="https://github.com/actions/runner/releases/download/v${runner_version}/${archive}"

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive_path" "$download_url"
          printf '%s  %s\n' "$runner_sha" "$archive_path" | sha256sum --check

          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$runner_sha" >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$archive_path" >> "$GITHUB_OUTPUT"

      - name: Transfer runner package to trip-prod-platform
        id: runner-transfer
        env:
          RUNNER_ARCHIVE: ${{ steps.runner-package.outputs.archive }}
          RUNNER_ARCHIVE_PATH: ${{ steps.runner-package.outputs.path }}
          RUNNER_ARCHIVE_SHA: ${{ steps.runner-package.outputs.sha }}
        run: |
          set -Eeuo pipefail

          remote_root="/var/tmp/trip-prod-platform-runner"
          remote_parts="${remote_root}/${RUNNER_ARCHIVE}.${RUNNER_ARCHIVE_SHA}.parts"
          staged_archive="${remote_root}/${RUNNER_ARCHIVE}"
          local_parts="${RUNNER_TEMP}/${RUNNER_ARCHIVE}.parts"
          transfer_id="${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}"

          printf 'staged_archive=%s\n' "$staged_archive" >> "$GITHUB_OUTPUT"

          if ssh production \
            "test -f '/opt/actions-runner/${RUNNER_ARCHIVE}' &&
             printf '%s  %s\n' '${RUNNER_ARCHIVE_SHA}' \
               '/opt/actions-runner/${RUNNER_ARCHIVE}' |
             sha256sum --check --status"; then
            echo "Verified runner archive already exists in /opt/actions-runner"
            exit 0
          fi

          if ssh production \
            "test -f '${staged_archive}' &&
             printf '%s  %s\n' '${RUNNER_ARCHIVE_SHA}' '${staged_archive}' |
             sha256sum --check --status"; then
            echo "Verified staged runner archive already exists"
            exit 0
          fi

          mkdir -p "$local_parts"
          split --bytes=8M --numeric-suffixes=0 --suffix-length=4 \
            "$RUNNER_ARCHIVE_PATH" "$local_parts/part-"

          ssh production \
            "install -d -m 700 '${remote_root}' '${remote_parts}'"

          upload_part() {
            local part="$1"
            local name expected remote_file remote_tmp attempt

            name="${part##*/}"
            expected="$(sha256sum "$part")"
            expected="${expected%% *}"
            remote_file="${remote_parts}/${name}"
            remote_tmp="${remote_file}.partial.${transfer_id}"

            if ssh production \
              "test -f '${remote_file}' &&
               printf '%s  %s\n' '${expected}' '${remote_file}' |
               sha256sum --check --status"; then
              echo "Reusing verified ${name}"
              return 0
            fi

            for attempt in 1 2 3 4 5; do
              if timeout --signal=TERM 600 \
                   scp -q -o ConnectTimeout=20 \
                     "$part" "production:${remote_tmp}" &&
                 ssh production \
                   "printf '%s  %s\n' '${expected}' '${remote_tmp}' |
                      sha256sum --check --status &&
                    mv -f -- '${remote_tmp}' '${remote_file}'"; then
                echo "Uploaded ${name}"
                return 0
              fi

              ssh production "rm -f -- '${remote_tmp}'" || true
              sleep "$((attempt * 5))"
            done

            echo "Failed to upload ${name}" >&2
            return 1
          }

          export -f upload_part
          export remote_parts transfer_id

          printf '%s\0' "$local_parts"/part-* |
            xargs -0 -r -n1 -P4 \
              bash -c 'set -Eeuo pipefail; upload_part "$1"' _

          ssh production bash -s -- \
            "$remote_parts" "$staged_archive" "$RUNNER_ARCHIVE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          parts_dir="$1"
          archive="$2"
          expected_sha="$3"
          assembling="${archive}.assembling"

          cat "$parts_dir"/part-* > "$assembling"
          printf '%s  %s\n' "$expected_sha" "$assembling" | sha256sum --check
          mv -f -- "$assembling" "$archive"
          rm -rf -- "$parts_dir"
          REMOTE

      - name: Install and register runner
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          RUNNER_ARCHIVE: ${{ steps.runner-package.outputs.archive }}
          RUNNER_ARCHIVE_SHA: ${{ steps.runner-package.outputs.sha }}
          RUNNER_STAGED_ARCHIVE: ${{ steps.runner-transfer.outputs.staged_archive }}
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TOKEN:?Missing RUNNER_REGISTRATION_TOKEN}"

          {
            printf 'runner_token=%q\n' "$RUNNER_TOKEN"
            cat <<'REMOTE'
          set -Eeuo pipefail

          archive="$1"
          runner_sha="$2"
          staged_archive="$3"
          runner_user="github-runner"
          runner_name="trip-prod-platform"
          host_name="trip-prod-platform"
          runner_dir="/opt/actions-runner"
          repository_url="https://github.com/PriessFlower/Trip-Booking-Spa"

          as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          as_runner() {
            if [ "$(id -u)" -eq 0 ]; then
              runuser -u "$runner_user" -- "$@"
            else
              sudo -n -u "$runner_user" -H "$@"
            fi
          }

          case "$(uname -m)" in
            x86_64)
              runner_arch="x64"
              ;;
            aarch64|arm64)
              runner_arch="arm64"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          runner_version="2.336.0"
          expected_archive="actions-runner-linux-${runner_arch}-${runner_version}.tar.gz"
          if [ "$archive" != "$expected_archive" ]; then
            echo "Runner archive does not match server architecture: $archive" >&2
            exit 1
          fi

          if ! id "$runner_user" >/dev/null 2>&1; then
            as_root useradd --create-home --shell /bin/bash "$runner_user"
          fi

          as_root hostnamectl set-hostname "$host_name"
          if ! getent hosts "$host_name" >/dev/null 2>&1; then
            printf '127.0.1.1 %s\n' "$host_name" | as_root tee -a /etc/hosts >/dev/null
          fi
          getent group docker >/dev/null
          as_root usermod --append --groups docker "$runner_user"
          as_root install -d -m 755 -o "$runner_user" -g "$runner_user" "$runner_dir"
          as_root install -d -m 700 -o "$runner_user" -g "$runner_user" /opt/trip-booking-spa

          cd "$runner_dir"
          if [ -f "$archive" ] &&
             printf '%s  %s\n' "$runner_sha" "$archive" |
               sha256sum --check --status; then
            echo "Using verified runner archive already in $runner_dir"
          else
            printf '%s  %s\n' "$runner_sha" "$staged_archive" | sha256sum --check
            as_root install -m 644 -o "$runner_user" -g "$runner_user" \
              "$staged_archive" "$archive"
          fi

          if [ -f "$staged_archive" ]; then
            as_root rm -f -- "$staged_archive"
          fi

          printf '%s  %s\n' "$runner_sha" "$archive" | sha256sum --check

          if [ ! -x ./config.sh ]; then
            as_root tar xzf "$archive" --no-same-owner
            as_root chown -R "$runner_user:$runner_user" "$runner_dir"
          fi

          if [ ! -f .runner ]; then
            as_root ./bin/installdependencies.sh

            token_source="$(mktemp)"
            token_file="$runner_dir/.registration-token.env"
            chmod 600 "$token_source"
            printf 'ACTIONS_RUNNER_INPUT_TOKEN=%q\n' "$runner_token" > "$token_source"
            as_root install -m 600 -o "$runner_user" -g "$runner_user" \
              "$token_source" "$token_file"
            rm -f -- "$token_source"
            runner_token=""

            as_runner bash -c '
              set -Eeuo pipefail
              token_file="$1"
              shift
              trap "rm -f -- \"\$token_file\"" EXIT
              . "$token_file"
              export ACTIONS_RUNNER_INPUT_TOKEN
              ./config.sh "$@"
            ' _ "$token_file" \
              --unattended \
              --url "$repository_url" \
              --name "$runner_name" \
              --labels tencent-cloud,production,platform \
              --work _work \
              --replace
          fi

          runner_token=""

          if ! compgen -G '/etc/systemd/system/actions.runner.PriessFlower-Trip-Booking-Spa.*.service' >/dev/null; then
            as_root ./svc.sh install "$runner_user"
          fi
          as_root ./svc.sh start
          as_root ./svc.sh status

          as_runner docker version --format 'runner_docker_server={{.Server.Version}}'
          REMOTE
          } | ssh production bash -s -- \
            "$RUNNER_ARCHIVE" \
            "$RUNNER_ARCHIVE_SHA" \
            "$RUNNER_STAGED_ARCHIVE"
