name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NAME: ccr.ccs.tencentyun.com/priessflower/trip-booking-spa

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --activate-profiles test verify

  publish:
    name: Build and publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on:
      - self-hosted
      - Linux
      - X64
      - tencent-cloud
      - production
      - platform
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    env:
      JAVA_HOME: /usr/lib/jvm/java-21
      RUNTIME_BASE_IMAGE: ccr.ccs.tencentyun.com/priessflower/trip-booking-spa:runtime-base-jre21
      RUNTIME_BASE_SOURCE_IMAGE: ccr.ccs.tencentyun.com/priessflower/trip-booking-spa:472c10892171a7157895de2549a527c60ca8d668
      RUNTIME_BASE_SOURCE_REPO_DIGEST: ccr.ccs.tencentyun.com/priessflower/trip-booking-spa@sha256:f1647263955accb7b08a027ecf75c930b79a6c14e936359b31d943b4b3bf231f

    steps:
      # 这一步必须留着 actions/checkout，别再改成裸 git（2026-08-17 我试过，双重不通）：
      #   ① 平台 runner(ins-cez660p7, TencentOS 4)上【没装 git】——裸 git 直接 command not found；
      #   ② 该机【连不上 github.com】(curl 超时)，而 codeload / api.github.com /
      #      objects.githubusercontent.com 都通。git 协议走的正是不通的那个域。
      # 08-17 发布卡死的真因是 GitHub 侧故障期间 codeload 对该出口 IP 返 429，属于暂时性；
      # 故障恢复后 codeload 已回 301/0.6s。换句话说当时该等，不该改检出方式。
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify platform build tools
        run: |
          set -Eeuo pipefail
          export PATH="$JAVA_HOME/bin:$PATH"

          test "$(hostname)" = trip-prod-platform
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"
          command -v mvn >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null

          java_version="$(java -version 2>&1)"
          maven_version="$(mvn --version)"
          grep -Eq 'version "21[.]' <<< "$java_version"
          grep -Eq '^Java version: 21[.]' <<< "$maven_version"
          docker version --format 'docker_server={{.Server.Version}}'

      - name: Build application JAR on platform
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:?Missing RUNNER_TEMP}"
          export PATH="$JAVA_HOME/bin:$PATH"

          maven_settings="$RUNNER_TEMP/tencent-cloud-maven-settings.xml"
          cleanup_maven_settings() {
            rm -f -- "$maven_settings"
          }
          trap cleanup_maven_settings EXIT

          umask 077
          cat > "$maven_settings" <<'SETTINGS'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>tencent-cloud</id>
                <name>Tencent Cloud Maven mirror</name>
                <url>https://mirrors.cloud.tencent.com/nexus/repository/maven-public/</url>
                <mirrorOf>*</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          SETTINGS

          mvn \
            --settings "$maven_settings" \
            --batch-mode \
            --no-transfer-progress \
            --activate-profiles prod \
            -DskipTests \
            clean package

          test -s target/trip-booking-spa-0.0.1.jar

      - name: Log in to TCR with isolated credentials
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:?Missing RUNNER_TEMP}"
          : "${TCR_USERNAME:?Missing TCR_USERNAME}"
          : "${TCR_PASSWORD:?Missing TCR_PASSWORD}"

          docker_config="$RUNNER_TEMP/trip-booking-spa-docker"
          install -d -m 700 "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          printf '%s' "$TCR_PASSWORD" | docker login \
            "$TCR_REGISTRY" \
            --username "$TCR_USERNAME" \
            --password-stdin

      - name: Ensure TCR runtime base exists
        run: |
          set -Eeuo pipefail
          : "${GITHUB_RUN_ID:?Missing GITHUB_RUN_ID}"
          : "${RUNNER_TEMP:?Missing RUNNER_TEMP}"

          lock_dir="$(dirname "$RUNNER_TEMP")/.trip-booking-spa-locks"
          install -d -m 700 "$lock_dir"
          exec 9>"$lock_dir/runtime-base-jre21.lock"
          flock --exclusive 9

          pull_runtime_base() {
            local output status
            if output="$(docker pull "$RUNTIME_BASE_IMAGE" 2>&1)"; then
              printf '%s\n' "$output"
              return 0
            else
              status="$?"
            fi

            printf '%s\n' "$output" >&2
            if grep -Eqi '(manifest.*unknown|manifest.*not found|not found.*manifest)' \
              <<< "$output"; then
              return 10
            fi

            echo "TCR lookup failed for a reason other than a missing manifest; refusing to bootstrap." >&2
            return "$status"
          }

          verify_runtime_base() {
            local image_env
            test "$(docker image inspect --format '{{.Os}}' "$RUNTIME_BASE_IMAGE")" = linux
            test "$(docker image inspect --format '{{.Architecture}}' "$RUNTIME_BASE_IMAGE")" = amd64
            test "$(docker image inspect --format '{{.Config.User}}' "$RUNTIME_BASE_IMAGE")" = app
            test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$RUNTIME_BASE_IMAGE")" = /app
            test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$RUNTIME_BASE_IMAGE")" = \
              '["java","-jar","/app/app.jar"]'
            image_env="$(docker image inspect \
              --format '{{range .Config.Env}}{{println .}}{{end}}' "$RUNTIME_BASE_IMAGE")"
            grep -Fx 'JAVA_HOME=/opt/java/openjdk' <<< "$image_env"
            docker run --rm --network none --entrypoint /bin/sh "$RUNTIME_BASE_IMAGE" \
              -c 'set -eu; test ! -e /app/app.jar; test "$(id -un)" = app; java -version'
          }

          if pull_runtime_base; then
            verify_runtime_base
            echo "Using existing runtime base: $RUNTIME_BASE_IMAGE"
            exit 0
          else
            pull_status="$?"
            if [ "$pull_status" -ne 10 ]; then
              exit "$pull_status"
            fi
          fi

          echo "Runtime base is absent; deriving it once from pinned source $RUNTIME_BASE_SOURCE_IMAGE"
          docker pull "$RUNTIME_BASE_SOURCE_IMAGE"

          # A second lookup makes creation idempotent if another builder won a race.
          if pull_runtime_base; then
            verify_runtime_base
            echo "Runtime base was published by another builder."
            exit 0
          else
            pull_status="$?"
            if [ "$pull_status" -ne 10 ]; then
              exit "$pull_status"
            fi
          fi

          test "$(docker image inspect --format '{{.Os}}' "$RUNTIME_BASE_SOURCE_IMAGE")" = linux
          test "$(docker image inspect --format '{{.Architecture}}' "$RUNTIME_BASE_SOURCE_IMAGE")" = amd64
          test "$(docker image inspect --format '{{.Config.User}}' "$RUNTIME_BASE_SOURCE_IMAGE")" = app
          test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$RUNTIME_BASE_SOURCE_IMAGE")" = /app
          expected_entrypoint='["java","-jar","/app/app.jar"]'
          actual_entrypoint="$(docker image inspect \
            --format '{{json .Config.Entrypoint}}' "$RUNTIME_BASE_SOURCE_IMAGE")"
          if [ "$actual_entrypoint" != "$expected_entrypoint" ]; then
            echo "Refusing to derive runtime base from an unexpected source image." >&2
            exit 1
          fi
          source_env="$(docker image inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' "$RUNTIME_BASE_SOURCE_IMAGE")"
          grep -Fx 'JAVA_HOME=/opt/java/openjdk' <<< "$source_env"
          source_repo_digests="$(docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' "$RUNTIME_BASE_SOURCE_IMAGE")"
          grep -Fx "$RUNTIME_BASE_SOURCE_REPO_DIGEST" <<< "$source_repo_digests"
          docker run --rm --network none --entrypoint /bin/sh "$RUNTIME_BASE_SOURCE_IMAGE" \
            -c 'set -eu; test -s /app/app.jar; test "$(id -un)" = app; java -version'

          seed_container="trip-runtime-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          cleanup_seed_container() {
            docker rm -f -- "$seed_container" >/dev/null 2>&1 || true
          }
          trap cleanup_seed_container EXIT
          cleanup_seed_container

          docker create \
            --name "$seed_container" \
            --entrypoint /bin/sh \
            "$RUNTIME_BASE_SOURCE_IMAGE" \
            -c 'set -eu; test -f /app/app.jar; rm -f /app/app.jar; test ! -e /app/app.jar' \
            >/dev/null
          docker start --attach "$seed_container"

          docker export "$seed_container" | docker import \
            --change 'ENV PATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            --change 'ENV JAVA_HOME=/opt/java/openjdk' \
            --change 'ENV LANG=en_US.UTF-8' \
            --change 'ENV LANGUAGE=en_US:en' \
            --change 'ENV LC_ALL=en_US.UTF-8' \
            --change 'ENV SPRING_PROFILES_ACTIVE=prod' \
            --change 'WORKDIR /app' \
            --change 'USER app' \
            --change 'EXPOSE 8080' \
            --change 'ENTRYPOINT ["java","-jar","/app/app.jar"]' \
            - "$RUNTIME_BASE_IMAGE"

          verify_runtime_base
          docker push "$RUNTIME_BASE_IMAGE"

      - name: Build and publish image without public registries
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail

          test -s target/trip-booking-spa-0.0.1.jar
          docker image inspect "$RUNTIME_BASE_IMAGE" >/dev/null

          docker build \
            --pull=false \
            --network=none \
            --build-arg "RUNTIME_IMAGE=$RUNTIME_BASE_IMAGE" \
            --tag "$IMAGE" \
            --tag "$IMAGE_NAME:latest" \
            .

          test "$(docker image inspect --format '{{.Os}}' "$IMAGE")" = linux
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = amd64
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = app
          test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$IMAGE")" = /app
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE")" = \
            '["java","-jar","/app/app.jar"]'
          image_env="$(docker image inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE")"
          grep -Fx 'JAVA_HOME=/opt/java/openjdk' <<< "$image_env"
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE" \
            -c 'set -eu; test -s /app/app.jar; test "$(id -un)" = app; java -version'

          docker push "$IMAGE"
          docker push "$IMAGE_NAME:latest"

      - name: Remove platform TCR credentials
        if: always()
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:?Missing RUNNER_TEMP}"

          docker_config="$RUNNER_TEMP/trip-booking-spa-docker"
          export DOCKER_CONFIG="$docker_config"
          docker logout "$TCR_REGISTRY" >/dev/null 2>&1 || true
          rm -f -- "$docker_config/config.json"
          rmdir -- "$docker_config" 2>/dev/null || true

  deploy:
    name: Deploy production
    needs: publish
    runs-on:
      - self-hosted
      - Linux
      - X64
      - tencent-cloud
      - production
      - platform
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${RUNNER_TEMP:?Missing RUNNER_TEMP}"

          ssh_dir="$RUNNER_TEMP/trip-booking-spa-deploy-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/deploy_key"
          chmod 600 "$ssh_dir/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $ssh_dir/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile $ssh_dir/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 "$ssh_dir/config"

      - name: Verify deployment target
        run: |
          set -Eeuo pipefail
          ssh -F "$RUNNER_TEMP/trip-booking-spa-deploy-ssh/config" production \
            'set -Eeuo pipefail
             actual_hostname="$(hostname)"
             if [ "$actual_hostname" != trip-offline ]; then
               echo "Refusing to deploy: expected trip-offline, got $actual_hostname" >&2
               exit 1
             fi'

      - name: Stage production runtime configuration
        env:
          DB_HOST: ${{ vars.PROD_DB_HOST }}
          DB_PORT: ${{ vars.PROD_DB_PORT }}
          DB_NAME: ${{ vars.PROD_DB_NAME }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          REDIS_HOST: ${{ vars.PROD_REDIS_HOST }}
          REDIS_PORT: ${{ vars.PROD_REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          NACOS_SERVER_ADDR: ${{ vars.PROD_NACOS_SERVER_ADDR }}
          NACOS_NAMESPACE: ${{ vars.PROD_NACOS_NAMESPACE }}
          NACOS_USERNAME: ${{ secrets.PROD_NACOS_USERNAME }}
          NACOS_PASSWORD: ${{ secrets.PROD_NACOS_PASSWORD }}
          SERVER_ADDRESS: ${{ vars.PROD_SERVER_ADDRESS }}
          EXPEDIA_API_KEY: ${{ secrets.PROD_EXPEDIA_API_KEY }}
          EXPEDIA_SHARED_SECRET: ${{ secrets.PROD_EXPEDIA_SHARED_SECRET }}
          EXPEDIA_API_HOST: ${{ vars.PROD_EXPEDIA_API_HOST }}
          # 艺龙。与 Expedia 同规：凭证与端点缺一即拒绝部署（见下方 required_values）。
          # 不为"缺了只停这一家"网开一面——那正是附录 A 反复警告的静默降级：服务照常
          # 启动、日志一片祥和，故障要等真实流量打上来才暴露。此处尤其危险，因为
          # ELONG_API_HOST 的代码兜底值是测试端点，而艺龙 api-test 已于 2026-08-15
          # 实测全服务 403——漏配的后果不是"艺龙没开"，是"艺龙每次查价都失败"。
          #
          # CUSTOMER_IP_FALLBACK 有意不列入：它有可用的代码兜底（cursor 生产实证过闸
          # 的出口 IP），缺失只是少一次风控优化，不会导致链路失效。
          ELONG_USER: ${{ secrets.PROD_ELONG_USER }}
          ELONG_APP_KEY: ${{ secrets.PROD_ELONG_APP_KEY }}
          ELONG_SECRET: ${{ secrets.PROD_ELONG_SECRET }}
          ELONG_API_HOST: ${{ vars.PROD_ELONG_API_HOST }}
          ELONG_CUSTOMER_IP_FALLBACK: ${{ vars.PROD_ELONG_CUSTOMER_IP_FALLBACK }}
        run: |
          set -Eeuo pipefail

          required_values=(
            DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD
            REDIS_HOST REDIS_PORT
            NACOS_SERVER_ADDR NACOS_NAMESPACE NACOS_USERNAME NACOS_PASSWORD
            SERVER_ADDRESS EXPEDIA_API_KEY EXPEDIA_SHARED_SECRET EXPEDIA_API_HOST
            ELONG_USER ELONG_APP_KEY ELONG_SECRET ELONG_API_HOST
          )

          for name in "${required_values[@]}"; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Missing production configuration: $name" >&2
              exit 1
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Production configuration contains a newline: $name" >&2
              exit 1
            fi
          done

          if [ "$DB_NAME" != tg_trip_spa ]; then
            echo "DB_NAME must point to the production tg_trip_spa database." >&2
            exit 1
          fi

          if [ "$NACOS_SERVER_ADDR" != 172.21.32.14:8848 ]; then
            echo "NACOS_SERVER_ADDR must point to platform Nacos at 172.21.32.14:8848." >&2
            exit 1
          fi

          # 艺龙测试网关已于 2026-08-15 实测全服务 403，指向它等于每次调用都失败。
          # 代码兜底值恰是该测试端点（安全侧默认，§3.3.3），故生产必须显式覆盖——
          # 这里挡住"忘了覆盖"这一种漏配。
          if [ "$ELONG_API_HOST" != https://api.elong.com/rest ]; then
            echo "ELONG_API_HOST must point to the production gateway https://api.elong.com/rest (the test gateway is defunct)." >&2
            exit 1
          fi

          {
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'REDIS_HOST=%s\n' "$REDIS_HOST"
            printf 'REDIS_PORT=%s\n' "$REDIS_PORT"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'NACOS_SERVER_ADDR=%s\n' "$NACOS_SERVER_ADDR"
            printf 'NACOS_NAMESPACE=%s\n' "$NACOS_NAMESPACE"
            printf 'NACOS_USERNAME=%s\n' "$NACOS_USERNAME"
            printf 'NACOS_PASSWORD=%s\n' "$NACOS_PASSWORD"
            printf 'SERVER_ADDRESS=%s\n' "$SERVER_ADDRESS"
            printf 'EXPEDIA_API_KEY=%s\n' "$EXPEDIA_API_KEY"
            printf 'EXPEDIA_SHARED_SECRET=%s\n' "$EXPEDIA_SHARED_SECRET"
            printf 'EXPEDIA_API_HOST=%s\n' "$EXPEDIA_API_HOST"
            printf 'ELONG_USER=%s\n' "$ELONG_USER"
            printf 'ELONG_APP_KEY=%s\n' "$ELONG_APP_KEY"
            printf 'ELONG_SECRET=%s\n' "$ELONG_SECRET"
            printf 'ELONG_API_HOST=%s\n' "$ELONG_API_HOST"
            printf 'ELONG_CUSTOMER_IP_FALLBACK=%s\n' "$ELONG_CUSTOMER_IP_FALLBACK"
          } | ssh -F "$RUNNER_TEMP/trip-booking-spa-deploy-ssh/config" production \
            'set -Eeuo pipefail; app_dir=/opt/trip-booking-spa; install -d -m 700 "$app_dir"; umask 077; cat > "$app_dir/app.env.next"'

      - name: Log in to TCR on deployment server
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$TCR_PASSWORD" | \
            ssh -F "$RUNNER_TEMP/trip-booking-spa-deploy-ssh/config" production \
            "docker login '${{ env.TCR_REGISTRY }}' --username '$TCR_USERNAME' --password-stdin"

      - name: Deploy container
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ssh -F "$RUNNER_TEMP/trip-booking-spa-deploy-ssh/config" production \
            bash -s -- "$IMAGE" <<'REMOTE'
          set -Eeuo pipefail

          image="$1"
          app_name="trip-booking-spa"
          app_dir="/opt/trip-booking-spa"
          env_file="$app_dir/app.env"
          next_env_file="$app_dir/app.env.next"
          previous_env_file="$app_dir/app.env.previous"
          previous_image=""
          had_previous_container=false
          had_previous_env=false
          config_activated=false
          container_replaced=false

          test -s "$next_env_file"

          env_value() {
            sed -n "s/^$1=//p" "$next_env_file" | tail -n 1
          }

          check_tcp() {
            local host="$1"
            local port="$2"
            timeout 5 bash -c "</dev/tcp/$host/$port"
          }

          start_container() {
            docker run -d \
              --name "$app_name" \
              --restart unless-stopped \
              --network host \
              --env-file "$env_file" \
              --volume "$app_name-logs:/home/webrun/logs/file" \
              --volume "$app_name-spa-logs:/home/webrun/spa/logs/file" \
              "$1"
          }

          wait_for_health() {
            local response
            for _ in $(seq 1 30); do
              response="$(curl --fail --silent --max-time 3 \
                http://127.0.0.1:8080/actuator/health 2>/dev/null || true)"
              if printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          rollback() {
            local failure_status="$?"
            trap - ERR
            echo "Deployment failed; restoring the previous release." >&2

            if [ "$container_replaced" = true ]; then
              docker logs --tail 200 "$app_name" >&2 2>/dev/null || true
              docker rm -f "$app_name" >/dev/null 2>&1 || true
            fi

            if [ "$config_activated" = true ]; then
              if [ "$had_previous_env" = true ]; then
                mv -f "$previous_env_file" "$env_file"
              else
                rm -f "$env_file"
              fi
            fi

            if [ "$had_previous_container" = true ] && [ -n "$previous_image" ]; then
              start_container "$previous_image" >/dev/null
              if wait_for_health; then
                echo "Rollback succeeded: $previous_image"
              else
                echo "Rollback container failed its health check." >&2
              fi
            fi

            rm -f "$next_env_file"
            exit "$failure_status"
          }

          trap rollback ERR

          db_host="$(env_value DB_HOST)"
          db_port="$(env_value DB_PORT)"
          redis_host="$(env_value REDIS_HOST)"
          redis_port="$(env_value REDIS_PORT)"
          nacos_address="$(env_value NACOS_SERVER_ADDR)"
          nacos_host="${nacos_address%:*}"
          nacos_port="${nacos_address##*:}"

          if [ -z "$nacos_host" ] || [ "$nacos_host" = "$nacos_address" ]; then
            echo "NACOS_SERVER_ADDR must use host:port format." >&2
            false
          fi
          case "$nacos_port" in
            ''|*[!0-9]*)
              echo "Nacos port must be numeric: $nacos_port" >&2
              false
              ;;
          esac
          if [ "${#nacos_port}" -gt 5 ] || \
             (( 10#$nacos_port < 1 || 10#$nacos_port > 64535 )); then
            echo "Nacos port must be between 1 and 64535: $nacos_port" >&2
            false
          fi
          nacos_grpc_port=$((10#$nacos_port + 1000))

          check_tcp "$db_host" "$db_port"
          check_tcp "$redis_host" "$redis_port"
          check_tcp "$nacos_host" "$nacos_port"
          check_tcp "$nacos_host" "$nacos_grpc_port"
          docker pull "$image"

          if docker inspect "$app_name" >/dev/null 2>&1; then
            had_previous_container=true
            previous_image="$(docker inspect --format '{{.Config.Image}}' "$app_name")"
          fi

          rm -f "$previous_env_file"
          if [ -s "$env_file" ]; then
            cp -p "$env_file" "$previous_env_file"
            had_previous_env=true
          fi

          mv -f "$next_env_file" "$env_file"
          chmod 600 "$env_file"
          config_activated=true

          docker rm -f "$app_name" >/dev/null 2>&1 || true
          container_replaced=true

          start_container "$image"

          wait_for_health

          trap - ERR
          rm -f "$previous_env_file"
          echo "Deployment succeeded: $image"
          REMOTE

      - name: Log out from TCR on deployment server
        if: always()
        run: |
          ssh -F "$RUNNER_TEMP/trip-booking-spa-deploy-ssh/config" production \
            "docker logout '${{ env.TCR_REGISTRY }}' >/dev/null 2>&1 || true" || true

      - name: Remove deployment SSH material
        if: always()
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/trip-booking-spa-deploy-ssh"
          rm -f -- \
            "$ssh_dir/deploy_key" \
            "$ssh_dir/known_hosts" \
            "$ssh_dir/config"
          rmdir -- "$ssh_dir" 2>/dev/null || true
