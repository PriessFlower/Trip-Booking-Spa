server:
  port: 8080

spring:
  config:
    import: optional:nacos:trip-booking-spa.yaml
  # 基础设施连接一律由环境变量注入，与 prod 同形，仓库内不落任何地址与口令。
  # 原先写死的 hotel_base_info（8.146.211.133，账号 bystest）是旧中台库，
  # 系改名迁移遗留；项目已迁至 spa 专属库 tg_trip_spa。
  datasource:
    host: ${DB_HOST}
    port: ${DB_PORT:3306}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.name}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries = true&nullCatalogMeansCurrent=true&serverTimezone=GMT%2B8
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 8
        max-idle: 32
        min-idle: 4
  cloud:
    nacos:
      discovery:
        # Nacos服务注册中心地址
        server-addr: ${NACOS_SERVER_ADDR}
        # 生产环境
        namespace: ${NACOS_NAMESPACE:dev}
        # Nacos 认证用户
        username: ${NACOS_USERNAME:}
        # Nacos 认证密码
        password: ${NACOS_PASSWORD:}
      config:
        # 是否开启配置中心 默认true
        enabled: true
        # 指定Nacos配置中心的地址
        server-addr: ${NACOS_SERVER_ADDR}
        # 区分环境：开发环境、测试环境、预发布环境、⽣产环境
        namespace: ${NACOS_NAMESPACE:dev}
        # 区分不同应⽤：同⼀个环境内，不同应⽤的配置，通过group来区分。
        group: DEFAULT_GROUP
        #指定yaml格式的配置 默认properties
        file-extension: yaml
        # 自动刷新配置文件,默认true
        refresh-enabled: true
        # Nacos 认证用户
        username: ${NACOS_USERNAME:}
        # Nacos 认证密码
        password: ${NACOS_PASSWORD:}
        # 配置文件prefix
        prefix: ${spring.application.name}


management:
  endpoints:
    web:
      exposure:
        include: prometheus

# rocketmq：pom 无该依赖、代码零引用，本段为改名迁移遗留的死配置。
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:}
  producer:
    # 发送同一类消息的设置为同一个group，保证唯一
    group: springboot_producer_group
    # 发送消息超时时间，默认3000
    sendMessageTimeout: 10000
    # 发送消息失败重试次数，默认2
    retryTimesWhenSendFailed: 2
    # 异步消息重试此处，默认2
    retryTimesWhenSendAsyncFailed: 2
    # 消息最大长度，默认1024 * 1024 * 4(默认4M)
    maxMessageSize: 4096
    # 压缩消息阈值，默认4k(1024 * 4)
    compressMessageBodyThreshold: 4096
    # 是否在内部发送失败时重试另一个broker，默认false
    retryNextServer: false

    topic: test
    #sync tag(同步消息tag)
    sync-tag: sync-tags
    #async tag(异步消息tag)
    async-tag: async-tags
    #oneway tag(单向消息tag)
    oneway-tag: oneway-tags

  consumer:
    group: test
    #监听主题
    topic: test
    # 一次拉取消息最大值，注意是拉取消息的最大值而非消费最大值
    pull-batch-size: 10
  hotel:
    group: hotel_consumer_group
    topic: hotel_order_topic
  room:
    group: room_consumer_group
    topic: room_order_topic
  product:
    group: product_consumer_group
    topic: product_order_topic

  enhance:
    # 启动隔离，用于激活配置类EnvironmentIsolationConfig
    # 启动后会自动在topic上拼接激活的配置文件，达到自动隔离的效果
    enabledIsolation: true
    # 隔离环境名称，拼接到topic后，topic_dev，默认空字符串
    environment: dev
