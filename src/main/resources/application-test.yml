    port: 3306
    name: hotel_base_info
    username: bystest
    password: bystest
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.name}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries = true&nullCatalogMeansCurrent=true&serverTimezone=GMT%2B8
  redis:
    host: 8.146.211.133
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 32
        min-idle: 4
  cloud:
    nacos:
      discovery:
        # Nacos服务注册中心地址
        server-addr: 10.18.0.8:8848
        # 生产环境
        namespace: dev
        # Nacos 认证用户
        username: nacos-test
        # Nacos 认证密码
        password: cde3vfr4
      config:
        # 是否开启配置中心 默认true
