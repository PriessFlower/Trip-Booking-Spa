server:
  port: 8080
spring:
  application:
    name: trip-booking-spa
  sleuth:
    hystrix:
      strategy:
        enabled: false
  profiles:
    active: dev

mybatis:
  mapperLocations: classpath*:mapper/*.xml
  config-location: classpath:/mybatis-config.xml


supplier:
  expedia:
    partner-point-of-sale: ${EXPEDIA_PARTNER_POS:B2B_SA_PKG_MOD_AGENT}
    payment-terms: ${EXPEDIA_PAYMENT_TERMS:2}
    billing-terms: ${EXPEDIA_BILLING_TERMS:EAC}
    sales-channel: ${EXPEDIA_SALES_CHANNEL:agent_tool}

  elong:
    user: ${ELONG_USER:}
    app-key: ${ELONG_APP_KEY:}
    secret: ${ELONG_SECRET:}
    url-host: ${ELONG_API_HOST:https://api-test.elong.com/rest}
    version: "1.62"

  fliggy:
    app-key: ${FLIGGY_APP_KEY:}
    secret: ${FLIGGY_SECRET:}
    session: ${FLIGGY_SESSION:}
    # 网关无兜底(§3.3.3 禁以生产值作兜底;飞猪无沙箱网关,漏配须响亮失败)。生产值见 .env.example
    url-host: ${FLIGGY_API_HOST:}
    distributor: ${FLIGGY_DISTRIBUTOR:}
    # session 上次人工授权日期(yyyy-MM-dd)。重授权后必须同步更新,否则到期监控失真
    session-authorized-at: ${FLIGGY_SESSION_AUTHORIZED_AT:}

elong:

  # 下单安全护栏(§3.8,闸口由 AbstractBookingSyncSupportService 统一执行)。
  # 三家一律默认关,开哪一家都是"这家从此可以真扣钱"的显式决策(2026-09-07 Owner 定)。
  # 艺龙无沙箱:唯一可用端点即生产网关(api-test 2026-08-15 实测全服务 403),
  # 故本开关不存在"先在沙箱验一遍"的中间态,true 即真单真费用。
  booking-enabled: false
  customer-ip-fallback: ${ELONG_CUSTOMER_IP_FALLBACK:47.92.28.195}

expedia:
  # 同上。Expedia 有沙箱,但"下不下单"与"打哪个端点"是两个独立护栏:
  # 本开关管前者,production-endpoint-enabled 管后者,两者都关才是完全静默。
  # 2026-09-07 由 true 改 false:网关侧的闸此前无人执行,把闸接上时才发现它是开着的。
  # 2026-09-11 复开:b2b 后台已上线 b2b.haowan2000.com,代理商要能走完下单。端点仍是沙箱
  # (生产 EXPEDIA_API_HOST=test.ean.com),开它不产生真实订单与费用;真端点与本开关同时开
  # 由 ExpediaRapidProperties 启动即拒,故"误连生产"这条路仍是堵死的。
  booking-enabled: true
  production-endpoint-enabled: false
  user-agent: trip-booking-spa/0.0.1

logging:
  config: classpath:log4j2.xml
  level:
    root: info

#-------------------------------prometheus开启健康检查端点--------------------------------------------------------------
management:
  endpoint:
    health:
      show-details: always
    #可以关闭指定的端点
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,service-registry,prometheus,health-service"
