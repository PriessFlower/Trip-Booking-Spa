server:
  port: 8080
spring:
  application:
    name: trip-booking-spa
  sleuth:
    hystrix:
      strategy:
        enabled: false
  profiles:
    active: dev

mybatis:
  mapperLocations: classpath*:mapper/*.xml
  config-location: classpath:/mybatis-config.xml

# 统一限流（core/ratelimit/RateLimitManager）为运维可调配置，一律由 Nacos 下发，
# 兜底默认值见 RateLimitProperties 的 @Value（见 PROJECT.md §3.3）。此处不得配置。

expedia:
  # Booking stays disabled until certification and explicit production authorization.
  booking-enabled: false
  production-endpoint-enabled: false
  user-agent: trip-booking-spa/0.0.1
  # 查价单次返回的报价条数上限，Expedia 允许的最大值即 250。
  # 属我方调参，与合同车道参数（partner_point_of_sale 等，见各环境配置）无关。
  rate-plan-count: 250
  static-data:
    # 摄取总开关不在此处：它是运维可调开关，键为 Nacos 的
    # supplier.expedia.static-data-enabled，兜底默认值见 ExpediaRapidProperties（PROJECT.md §3.2.2、§3.3.3）。
    batch-size: 250
    language: en-US
    languages: ${EXPEDIA_STATIC_DATA_LANGUAGES:en-US,zh-CN}
    supply-source: expedia
    mapping-version: expedia-content-v2

# Legacy supplier beans are still present in the codebase. Keep them wired to a
# non-routable mock endpoint until those integrations are removed. A real local
# mock server can be supplied with MOCK_SUPPLIER_BASE_URL.
travelconnect:
  url:
    search: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/travelconnect/search
    hotel: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/travelconnect/hotel
    prebook: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/travelconnect/prebook
  companyId: mock
  signKey: mock

aichotels:
  url:
    host: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/aichotels
    cityList: /city-list
    hotelList: /hotel-list
    singleHotel: /hotel
    rooms: /rooms
    availability: /availability
    prebook: /prebook
  apiClientKey: mock
  secret: mock

didatravel:
  licenseKey: mock
  clientId: mock
  localFilePath: /tmp/trip-booking-spa/mock/didatravel

huitravel:
  url:
    hotellist: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/hotel-list
    hoteldetails: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/hotel-details
    getPrice: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/price
    checkavailability: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/check
  appkey: mock
  secretKey: mock

fliggy:
  distrib:
    url: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/fliggy
    sessionKey: mock
    appKey: mock
    appSecret: mock

fastPayHotels:
  username: mock
  password: mock
  client_id: mock
  client_secret: mock
  url:
    catalogue: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/fastpay/catalogue
    availability: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/fastpay/availability
    booking: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/fastpay/booking

ratehawk:
  key_id: mock
  api_key: mock
  url: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/ratehawk

meituan:
  url: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/meituan
  partner-id: 0
  key:
    public: mock
    secret: mock
  test: mock
  language: zh_CN
  method:
    list:
      path: hotel.list
      version: 1.0
    detail:
      path: hotel.detail
      version: 1.0
    check:
      path: hotel.check
      version: 1.0
    room:
      path: hotel.room
      version: 1.0
    goods:
      path: hotel.goods
      version: 1.0

logging:
  config: classpath:log4j2.xml
  level:
    root: info

#-------------------------------prometheus开启健康检查端点--------------------------------------------------------------
management:
  endpoint:
    health:
      show-details: always
    #可以关闭指定的端点
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,service-registry,prometheus,health-service"
