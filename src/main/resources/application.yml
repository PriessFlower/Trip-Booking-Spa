server:
  port: 8080
spring:
  application:
    name: trip-booking-spa
  sleuth:
    hystrix:
      strategy:
        enabled: false
  profiles:
    active: dev

mybatis:
  mapperLocations: classpath*:mapper/*.xml
  config-location: classpath:/mybatis-config.xml

# 统一限流（core/ratelimit/RateLimitManager）为运维可调配置，一律由 Nacos 下发，
# 兜底默认值见 RateLimitProperties 的 @Value（见 PROJECT.md §3.3）。此处不得配置。

# Expedia 合同档案参数。归入 supplier 域（§3.7.2 的封闭枚举中无 expedia），
# 键名三层、kebab-case（§3.7.1、§3.7.4）。
#
# 放在本文件而非各环境剖面，是因为它们不是基础设施差异——dev 与 prod 取值本就相同，
# 分存两处会让取值来源失去唯一性（§3.4.1、§3.3.1）。
#
# 四项构成一条合同车道，必须整体切换：混用不会被 Expedia 拒绝，只会静默返回另一条
# 车道的报价（实测同一报价贵约 18%）。ExpediaContractProfile 在启动期校验，凑不成
# 已知档案即拒绝启动——属安全护栏，故固定于此，禁止移入 Nacos（§3.2.3）。
# （rate_plan_count 曾在此处：已写死为代码常量 250——无"不发版即调整"的运维场景，§3.8.1）
supplier:
  expedia:
    partner-point-of-sale: ${EXPEDIA_PARTNER_POS:B2B_SA_PKG_MOD_AGENT}
    payment-terms: ${EXPEDIA_PAYMENT_TERMS:2}
    billing-terms: ${EXPEDIA_BILLING_TERMS:EAC}
    sales-channel: ${EXPEDIA_SALES_CHANNEL:agent_tool}
  # 艺龙（elong）。凭证一律经环境变量注入（§3.5.1），变量名登记于 .env.example；
  # cursor 仓曾把三项明文写进 yml，SPA 侧禁止重演。测试网关与生产网关凭证相同，
  # 端点兜底取测试网关为安全侧（§3.3.3）。运维可调项（resolve-enabled、
  # resolve-price-tolerance、限流 QPS）不在此处，见 Nacos。
  elong:
    user: ${ELONG_USER:}
    app-key: ${ELONG_APP_KEY:}
    secret: ${ELONG_SECRET:}
    url-host: ${ELONG_API_HOST:https://api-test.elong.com/rest}
    version: "1.62"

elong:
  # 下单闸口——安全护栏（§3.2.3），固定本文件、禁入 Nacos。
  #
  # ⚠️ 艺龙与 Expedia 的关键差异：没有沙箱。api-test 网关已死（2026-08-15 实测全服务 403），
  # 唯一可用端点即生产网关——本项打开后每一笔下单都是真实订单、真实费用（预付授信扣款）。
  # 下单链路验收以"免费取消窗口产品下真单 + 立即取消"方式人工确认后进行。
  # 取消（hotel.order.cancel）刻意不读本闸：已存在的真单必须永远可撤。
  booking-enabled: false
  # 下单 CustomerIPAddress 兜底（艺龙风控必填，缺失报 H001012）。
  # 默认值为 cursor 生产实证过闸的出口 IP，SPA 生产可经环境变量切为腾讯云出口。
  customer-ip-fallback: ${ELONG_CUSTOMER_IP_FALLBACK:47.92.28.195}

expedia:
  # 下单闸口。开启后仅在测试端点可下单——沙箱行为，不产生费用、不生成真实预订，
  # 上线验收需要走通下单与取消链路，故打开。
  #
  # 生产端点下单由 ExpediaRapidProperties 启动期硬拦，且无开关可绕（§3.2.3：
  # 安全护栏的变更必须经发版与评审，"改代码才能开"即最强形式）。
  #
  # ⚠️ 由此产生一处耦合：本项为 true 时，端点不得再指向生产。若日后把
  # EXPEDIA_API_HOST 切到 api.ean.com，服务将拒绝启动，须同时关闭本项，
  # 或等 Expedia 认证通过后另行评审放开生产下单。
  booking-enabled: true
  # 生产端点仍然关闭：误开将产生真实订单与真实费用。
  production-endpoint-enabled: false
  user-agent: trip-booking-spa/0.0.1
  static-data:
    # 摄取总开关不在此处：它是运维可调开关，键为 Nacos 的
    # supplier.expedia.static-data-enabled，兜底默认值见 ExpediaRapidProperties（PROJECT.md §3.2.2、§3.3.3）。
    batch-size: 250
    language: en-US
    languages: ${EXPEDIA_STATIC_DATA_LANGUAGES:en-US,zh-CN}
    supply-source: expedia
    mapping-version: expedia-content-v2

# Legacy supplier beans are still present in the codebase. Keep them wired to a
# non-routable mock endpoint until those integrations are removed. A real local
# mock server can be supplied with MOCK_SUPPLIER_BASE_URL.
travelconnect:
  url:
    search: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/travelconnect/search
    hotel: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/travelconnect/hotel
    prebook: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/travelconnect/prebook
  companyId: mock
  signKey: mock

aichotels:
  url:
    host: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/aichotels
    cityList: /city-list
    hotelList: /hotel-list
    singleHotel: /hotel
    rooms: /rooms
    availability: /availability
    prebook: /prebook
  apiClientKey: mock
  secret: mock

didatravel:
  licenseKey: mock
  clientId: mock
  localFilePath: /tmp/trip-booking-spa/mock/didatravel

huitravel:
  url:
    hotellist: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/hotel-list
    hoteldetails: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/hotel-details
    getPrice: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/price
    checkavailability: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/huitravel/check
  appkey: mock
  secretKey: mock


fastPayHotels:
  username: mock
  password: mock
  client_id: mock
  client_secret: mock
  url:
    catalogue: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/fastpay/catalogue
    availability: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/fastpay/availability
    booking: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/fastpay/booking

ratehawk:
  key_id: mock
  api_key: mock
  url: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/ratehawk

meituan:
  url: ${MOCK_SUPPLIER_BASE_URL:https://mock.invalid}/meituan
  partner-id: 0
  key:
    public: mock
    secret: mock
  test: mock
  language: zh_CN
  method:
    list:
      path: hotel.list
      version: 1.0
    detail:
      path: hotel.detail
      version: 1.0
    check:
      path: hotel.check
      version: 1.0
    room:
      path: hotel.room
      version: 1.0
    goods:
      path: hotel.goods
      version: 1.0

logging:
  config: classpath:log4j2.xml
  level:
    root: info

#-------------------------------prometheus开启健康检查端点--------------------------------------------------------------
management:
  endpoint:
    health:
      show-details: always
    #可以关闭指定的端点
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,service-registry,prometheus,health-service"
