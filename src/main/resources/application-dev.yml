server:
  port: 8089
spring:
  config:
    import: optional:nacos:trip-booking-spa.yaml
  datasource:
    host: 8.146.211.133
    port: 3306
    name: intl_bg_admin
    username: bystest
    password: bystest
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.name}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries = true&nullCatalogMeansCurrent=true&serverTimezone=CST&autoReconnect=true
  redis:
    host: 8.146.211.133
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 32
        min-idle: 4
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
#        group: DEV      # 配置分组
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml         # 配置文件格式
        prefix: trip-booking-spa      # 配置前缀，通常是应用名
    inetutils:
      preferred-networks: 192.168.111.198


management:
  endpoints:
    web:
      exposure:
        include: prometheus

rocketmq:
  name-server: 8.146.211.133:9876
  producer:
    # 发送同一类消息的设置为同一个group，保证唯一
    group: springboot_producer_group
    # 发送消息超时时间，默认3000
    sendMessageTimeout: 10000
    # 发送消息失败重试次数，默认2
    retryTimesWhenSendFailed: 2
    # 异步消息重试此处，默认2
    retryTimesWhenSendAsyncFailed: 2
    # 消息最大长度，默认1024 * 1024 * 4(默认4M)
    maxMessageSize: 4096
    # 压缩消息阈值，默认4k(1024 * 4)
    compressMessageBodyThreshold: 4096
    # 是否在内部发送失败时重试另一个broker，默认false
    retryNextServer: false

    topic: test
    #sync tag(同步消息tag)
    sync-tag: sync-tags
    #async tag(异步消息tag)
    async-tag: async-tags
    #oneway tag(单向消息tag)
    oneway-tag: oneway-tags

  consumer:
    group: test
    #监听主题
    topic: test
    # 一次拉取消息最大值，注意是拉取消息的最大值而非消费最大值
    pull-batch-size: 10
  hotel:
    group: hotel_consumer_group
    topic: hotel_order_topic
  room:
    group: room_consumer_group
    topic: room_order_topic
  product:
    group: product_consumer_group
    topic: product_order_topic

  enhance:
    # 启动隔离，用于激活配置类EnvironmentIsolationConfig
    # 启动后会自动在topic上拼接激活的配置文件，达到自动隔离的效果
    enabledIsolation: true
    # 隔离环境名称，拼接到topic后，topic_dev，默认空字符串
    environment: dev
expedia:
  apiKey: ${EXPEDIA_API_KEY:}
  sharedSecret: ${EXPEDIA_SHARED_SECRET:}
  session: ${EXPEDIA_CUSTOMER_SESSION_ID:trip-booking-spa-dev}
  ownIp: ${EXPEDIA_CUSTOMER_IP:127.0.0.1}
  localFilePath: /home/webrun/spa/logs/file
  # Tripbooking AI 新合同 B2B profile（2026-08 technical workshop P5/P83）
  partner_point_of_sale: ${EXPEDIA_PARTNER_POS:B2B_SA_PKG_MOD_AGENT}
  payment_terms: ${EXPEDIA_PAYMENT_TERMS:2}
  billing_terms: ${EXPEDIA_BILLING_TERMS:EAC}
  url:
    host: ${EXPEDIA_API_HOST:https://test.ean.com}
system:
  localFilePath: /home/webrun/spa/logs/file/
