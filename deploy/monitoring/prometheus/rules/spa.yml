# Thresholds are anchored to measured baselines, not to round numbers:
# price-refresh failure runs at ~0.17%, and ELONG SPA_SUPPLIER_API_PRODUCT_PRICES
# averages ~1.3 s. Each alert is therefore set roughly an order of magnitude above
# normal, so a firing rule means something actually changed.
groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "抓取目标 {{ $labels.job }} ({{ $labels.instance }}) 已 5 分钟抓不到"
          description: >-
            可能是应用挂了、端口变了，或安全组被改动。SPA 的抓取依赖 sg-2bkpoddf
            放行 8080 from sg-p1ogl5st，且该 ACCEPT 必须排在 deny-all 之前。

      - alert: SpaRestarted
        expr: process_uptime_seconds{job="trip-booking-spa"} < 300
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "SPA 进程在 5 分钟内重启过"
          description: "若非发版所致，检查 OOM 与崩溃日志。"

  - name: price-refresh
    rules:
      - alert: RefreshFailureRatioHigh
        expr: >-
          sum(rate(refresh_failed_count_total{job="trip-booking-spa"}[30m]))
          / sum(rate(refresh_rows_count_total{job="trip-booking-spa"}[30m])) > 0.02
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "刷价失败率 {{ $value | humanizePercentage }}，超过 2%"
          description: "基线约 0.17%，触发即为十倍以上劣化。先看是否供应商侧限流或频控。"

      - alert: RefreshStalled
        expr: sum(rate(refresh_rows_count_total{job="trip-booking-spa"}[1h])) == 0
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "刷价连续 3 小时没有产出任何行"
          description: "调度停摆或任务全量失败；空窗期比失败率更容易被忽略，故单独设一条。"

  - name: supplier-io
    rules:
      - alert: SupplierLatencyHigh
        expr: >-
          sum by (supplier, interface) (rate(supplier_io_access_time_sum{job="trip-booking-spa"}[15m]))
          / sum by (supplier, interface) (rate(supplier_io_access_time_count{job="trip-booking-spa"}[15m])) > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.supplier }} {{ $labels.interface }} 平均耗时 {{ $value | printf \"%.0f\" }} ms"
          description: "该计时器单位是毫秒。艺龙查价基线约 1300 ms。"

      - alert: SupplierErrorsAppearing
        # 正列而非反排（status!~...）：新增一个终态时，反排会把它默默算成异常；
        # 正列最坏是漏报，而漏报有守护测试兜——改 CallStatus 集合会让
        # MetricVocabularyArchRulesTest.O33 报红，提示同步改本表达式（O-5.3）
        expr: >-
          sum by (supplier, interface, status) (
            rate(supplier_io_access_count_total{job="trip-booking-spa",
                 status=~"rejected|throttled|timeout|error"}[15m])
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.supplier }} {{ $labels.interface }} 出现 status={{ $labels.status }}"
          description: >-
            rejected=供应商返业务错误码，throttled=被限流，timeout=超时，error=连接或解析失败。
            quoted 与 no_inventory 都是正常态——no_inventory 只是答了但没房，不算错。
            取值集合见 CallStatus 枚举（docs/observability.md O-3.1）。
        # 关闭条件（O-9.6）：若某供应商改用业务错误码表达无房，rejected 会常态化，
        # 届时须把该取值从本表达式移出，而不是调高阈值。

      - alert: SupplierAuthConfigDetected
        # 我方凭据/配置病（FailureKind.AUTH_CONFIG）：供应商无辜、重试无效、只有人能修。
        # 阈值就是"非零"——这一档的每一次出现都值得人看（MetricNames 同名注释）。
        # 历史代价：飞猪 session 过期被当"集成死"查了两个月（2026-06~08）。
        expr: >-
          sum by (supplier) (increase(supplier_auth_config_count_total{job="trip-booking-spa"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.supplier }} 检出我方凭据/配置病（AUTH_CONFIG）"
          description: >-
            session 过期、签名错或 IP 白名单问题。重试无效，勿拉黑产品、勿判无房；
            日志锚 [auth-config]。飞猪 session 须人工重授权并同批更新
            FLIGGY_SESSION 与 FLIGGY_SESSION_AUTHORIZED_AT 两个值。

  - name: application
    rules:
      - alert: HttpServerErrors
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="trip-booking-spa", status=~"5.."}[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "对外接口 5xx 速率 {{ $value | printf \"%.2f\" }}/s"

      - alert: HikariPoolSaturated
        expr: hikaricp_connections_pending{job="trip-booking-spa"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池持续有等待者（pending={{ $value }}）"
          description: "连接池不够用，或有慢查询占住连接不放。"

      - alert: JvmHeapHigh
        expr: >-
          sum(jvm_memory_used_bytes{job="trip-booking-spa", area="heap"})
          / sum(jvm_memory_max_bytes{job="trip-booking-spa", area="heap"}) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆使用率 {{ $value | humanizePercentage }}"

      - alert: GcOverheadHigh
        expr: jvm_gc_overhead_percent{job="trip-booking-spa"} > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GC 开销占比 {{ $value | humanizePercentage }}，应用大部分时间在回收内存"

  - name: capacity
    rules:
      - alert: SpaDiskLow
        expr: >-
          disk_free_bytes{job="trip-booking-spa"} / disk_total_bytes{job="trip-booking-spa"} < 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "trip-offline 磁盘 {{ $labels.path }} 剩余不足 10%"

      - alert: PlatformDiskLow
        expr: >-
          node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay"} < 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "platform 磁盘 {{ $labels.mountpoint }} 剩余不足 15%"
          description: >-
            这台同时跑 Nacos、部署 runner 与本监控栈；TSDB 上限 10 GB，
            盘满通常不是监控数据造成的。

  - name: credentials
    rules:
      - alert: SupplierCredentialExpiringSoon
        expr: supplier_credential_days_left_value < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "供应商 {{ $labels.supplier }} 凭据剩余 {{ $value }} 天（renewal={{ $labels.renewal }}）"
          description: >-
            HUMAN_ONLY 档没有自动续期，必须有人去供应商侧重新授权并更新环境变量。
            cursor 的飞猪 session 过期曾被当「集成死」查了两个月（2026-06~08-10）——
            这条规则存在的意义就是不再靠人脑记 90 天。负数=已过期。
