services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: trip-offline-nacos
    restart: unless-stopped
    env_file:
      - /opt/nacos/nacos.env
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

volumes:
  nacos-data:
    name: nacos-data
    external: true
  nacos-logs:
    name: nacos-logs
    external: true
