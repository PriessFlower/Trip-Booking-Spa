server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Only explicitly configured public hostnames may reach an application.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Refuse unknown SNI values before presenting the SPA certificate.
    ssl_reject_handshake on;
}
