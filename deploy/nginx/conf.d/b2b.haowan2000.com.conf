# B2B 代理商后台。前端源码在 trip-booking-b2b-web 仓，后端是本仓 b2b 包的 /b2b/**。
#
# 与 spa.haowan2000.com（B2C 演示站）分成两个虚拟主机，而不是在同一站下加一个路径前缀：
# 两站发版节奏不同，且 B2B 是封闭用户环境，独立主机名便于日后单独加来源限制。
#
# 单独一个 upstream 块而不复用 spa.haowan2000.com.conf 里那个：指向同一个后端，
# 但两文件互不依赖，删掉任一站不会让另一站的配置失效。
upstream trip_booking_b2b_backend {
    server 172.21.32.4:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# 80 只留健康检查与 ACME 续期，其余一律跳 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name b2b.haowan2000.com;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://b2b.haowan2000.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b2b.haowan2000.com;

    ssl_certificate /etc/letsencrypt/live/b2b.haowan2000.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b2b.haowan2000.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:B2B_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html/b2b/current;
    index index.html;
    client_max_body_size 1m;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 后端在同一进程里还挂着运维后门与上游取货端点，一个都不许从本站出去。
    #
    # /hotel/** 尤其要紧：代理商开户接口就在那底下（POST /hotel/b2b/agent），
    # 放出去等于任何人都能给自己开一个代理商账号，登录闸门随即形同虚设。
    # 这三条 404 是本站的安全前提，不是整洁——删掉任何一条都要重新评审。
    location ^~ /hotel/ {
        return 404;
    }

    location ^~ /client/ {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /actuator {
        return 404;
    }

    # B2C 演示站的匿名端点不属于本站，避免代理商侧出现一条不需登录的取价通道。
    location ^~ /bff/ {
        return 404;
    }

    location = /b2b {
        return 308 /b2b/;
    }

    location ^~ /b2b/ {
        limit_req zone=b2b_per_ip burst=15 nodelay;

        proxy_pass http://trip_booking_b2b_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 协议签署留痕记的是这个头的首段，缺了会把网关内网地址当成代理商来源 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        # 查询与下单都是同步等 Expedia，读超时须大于供应商侧最慢一档
        proxy_read_timeout 330s;
        proxy_send_timeout 15s;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /releases/ {
        root /usr/share/nginx/html/b2b;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~* \.map$ {
        return 404;
    }

    # img-src 放开 https:：酒店图片来自 Expedia 的图片域（i.travelapi.com），不经本站。
    # connect-src 只留 'self'：本站的取数一律打同源 /b2b/**。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' https: data:; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location ~ /\. {
        deny all;
    }
}
