upstream trip_booking_spa_backend {
    server 172.21.32.4:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Grafana on the platform host. Reachable only because sg-p1ogl5st allows 3000
# from this host's security group; it is never published on a public address.
upstream trip_grafana {
    server 172.21.32.14:3000 max_fails=3 fail_timeout=10s;
    keepalive 4;
}

# Port 80 remains available for health checks and ACME HTTP-01 renewal only.
# All application traffic is redirected to the fixed HTTPS hostname.
server {
    listen 80;
    listen [::]:80;
    server_name spa.haowan2000.com;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://spa.haowan2000.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spa.haowan2000.com;

    ssl_certificate /etc/letsencrypt/live/spa.haowan2000.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spa.haowan2000.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SPA_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html/current;
    index index.html;
    client_max_body_size 1m;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /bff {
        return 308 /bff/;
    }

    location ^~ /bff/ {
        limit_req zone=bff_per_ip burst=15 nodelay;

        proxy_pass http://trip_booking_spa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        proxy_send_timeout 15s;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Operations UI, not part of the application. There is deliberately no address
    # allow list: the operator reaches this through a proxy whose exit address
    # rotates, and a stale entry locks the operator out rather than keeping anyone
    # else in. Grafana's own login is the gate; the login endpoint is rate limited
    # below so that being publicly reachable does not make guessing cheap.
    location = /grafana {
        return 308 /grafana/;
    }

    # Both the login page and the credential POST land here. Kept separate from the
    # block below so the strict limit does not throttle normal dashboard traffic,
    # which pulls dozens of assets and queries per view.
    location = /grafana/login {
        limit_req zone=grafana_login_per_ip burst=5 nodelay;

        proxy_pass http://trip_grafana;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ^~ /grafana/ {
        # No URI part on proxy_pass: Grafana runs with serve_from_sub_path and
        # expects to receive the /grafana prefix itself.
        proxy_pass http://trip_grafana;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Grafana Live pushes panel updates over a WebSocket, which needs the upgrade
    # headers the block above deliberately clears for keepalive reuse.
    location ^~ /grafana/api/live/ {
        proxy_pass http://trip_grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    location /releases/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~* \.map$ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location ~ /\. {
        deny all;
    }
}
