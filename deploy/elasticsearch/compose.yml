services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: trip-elasticsearch
    restart: unless-stopped
    mem_limit: 6g
    environment:
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
    ports:
      - "172.21.32.16:9200:9200"
    volumes:
      - /opt/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - /opt/elasticsearch/jvm.options.d:/usr/share/elasticsearch/config/jvm.options.d:ro
      - /opt/elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
      - /opt/elasticsearch/data:/usr/share/elasticsearch/data
      - /opt/elasticsearch/logs:/usr/share/elasticsearch/logs
    secrets:
      - elastic_password
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
      nproc: 4096
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --fail
          --cacert config/certs/ca/ca.crt
          --user elastic:$$(cat /run/secrets/elastic_password)
          https://127.0.0.1:9200/_cluster/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

secrets:
  elastic_password:
    file: /opt/elasticsearch/secrets/elastic_password

